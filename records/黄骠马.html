<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>扫描信息</title>
<style>
body { font-family: 'Microsoft YaHei', sans-serif; padding: 20px; background: #f5f7fa; }
.card { background: white; border-radius: 12px; padding: 20px; max-width: 600px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
td { padding: 8px 5px; border-bottom: 1px solid #ecf0f1; font-size: 14px; }
td:first-child { font-weight: bold; color: #2c3e50; width: 35%; white-space: nowrap; }
</style>
</head>
<body>
<div class='card'>
<h2>📋 扫描信息</h2>
<table>
<tr><td>姓名：</td><td>3</td></tr>
<tr><td>武器：</td><td>张飞</td></tr>
<tr><td>坐骑：</td><td>丈八蛇矛</td></tr>
<tr><td>年龄：</td><td>黄骠马</td></tr>
</table>
</div>
</body>
</html>
